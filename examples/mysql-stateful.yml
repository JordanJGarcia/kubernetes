apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-stateful
  labels:
    app: mysql
  namespace: examples
spec:
  serviceName: mysql-headless
  replicas: 3
  selector:
    matchLabels:
      app: mysql
      env: test
  template:
    metadata:
      labels:
        app: mysql
        env: test
    spec:
      containers:
      - name: mysql
        image: mysql:8.2.0
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_PASSWORD
  volumeClaimTemplates:
  - metadata:
      name: mysql-data
    spec:
      accessModes:
      - "ReadWriteOnce"
      storageClassName: "mysql-pv"
      resources:
        requests:
          storage: 1Gi
