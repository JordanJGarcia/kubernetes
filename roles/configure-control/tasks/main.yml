---
- name: Initialize control node
  ansible.builtin.command: "kubeadm init --apiserver-advertise-address={{ hostvars[inventory_hostname]['ansible_host'] }}"
  register: "kubeadm_run"

- name: Get join command for compute nodes
  ansible.builtin.command: "kubeadm token create --print-join-command"
  register: join_cmd
  changed_when: false

- name: Copy join command to file
  ansible.builtin.copy:
    dest: "/etc/kubernetes/join-cmd.sh"
    mode: "0600"
    owner: "root"
    group: "root"
    content: "{{ join_cmd.stdout | trim }}"

- name: Set KUBECONFIG environment variable
  ansible.builtin.lineinfile:
    path: "/etc/profile.d/var.sh"
    create: true
    line: "export KUBECONFIG={{ kubeconfig }}"
    regexp: '^export\s+KUBECONFIG='
    state: "present"

- name: Set up Cilium
  ansible.builtin.import_tasks: setup-cilium.yml
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
...
